<div class="container mt-4">
  <h2>{{ id ? "Modifier un utilisateur" : "Ajouter un utilisateur" }}</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

    <label>Nom</label>
    <input type="text" class="form-control" formControlName="nom" />
    <div *ngIf="submitted && f['nom'].errors">
      <span class="text-danger">Nom obligatoire (min 2 caractères)</span>
    </div>

    <label>Prénom</label>
    <input type="text" class="form-control" formControlName="prenom" />

    <label>Email</label>
    <input type="email" class="form-control" formControlName="email" />

    <label>Téléphone</label>
    <input type="text" class="form-control" formControlName="telephone" />

    <div *ngIf="!id">
      <label>Mot de passe</label>
      <input type="password" class="form-control" formControlName="password" />
    </div>

    <label>Rôle</label>
    <select class="form-control" formControlName="role">
      <option value="">-- Choisir un rôle --</option>
      <option value="ADMIN">Admin</option>
      <option value="EMPLOYE">Employé</option>
      <option value="CLIENT">Client</option>
    </select>

    <label>Actif</label>
    <select class="form-control" formControlName="actif">
      <option [value]="true">Oui</option>
      <option [value]="false">Non</option>
    </select>

    <button class="btn btn-success mt-3" type="submit">
      {{ id ? "Mettre à jour" : "Enregistrer" }}
    </button>
    <button class="btn btn-secondary mt-3 ms-2" routerLink="/admin/utilisateur" type="button">Annuler</button>
  </form>
</div>

<div class="container mt-4">
  <div class="card shadow-lg border-0 rounded p-4">
    <div class="card-header bg-gradient text-white rounded-top">
      <h4 class="mb-0">
        <i class="fas fa-user me-2"></i> {{ id ? "Modifier un utilisateur" : "Ajouter un utilisateur" }}
      </h4>
    </div>

    <div class="card-body">
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

        <div class="row">
          <!-- Nom -->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Nom</label>
            <input type="text" class="form-control" formControlName="nom" placeholder="Entrez le nom" />
            <div *ngIf="submitted && f['nom'].errors" class="form-text text-danger">
              Nom obligatoire (min 2 caractères)
            </div>
          </div>

          <!-- Prénom -->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Prénom</label>
            <input type="text" class="form-control" formControlName="prenom" placeholder="Entrez le prénom" />
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="exemple@mail.com" />
        </div>

        <!-- Téléphone -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Téléphone</label>
          <input type="text" class="form-control" formControlName="telephone" placeholder="Ex: +221 77 123 45 67" />
        </div>

        <!-- Mot de passe (ajout uniquement) -->
        <div class="mb-3" *ngIf="!id">
          <label class="form-label fw-semibold">Mot de passe</label>
          <input type="password" class="form-control" formControlName="password" placeholder="********" />
        </div>

        <!-- Rôle & Actif -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Rôle</label>
            <select class="form-select" formControlName="role">
              <option value="">-- Choisir un rôle --</option>
              <option value="ADMIN">Admin</option>
              <option value="EMPLOYE">Employé</option>
              <option value="CLIENT">Client</option>
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Actif</label>
            <select class="form-select" formControlName="actif">
              <option [value]="true">Oui</option>
              <option [value]="false">Non</option>
            </select>
          </div>
        </div>

        <!-- Boutons -->
        <div class="d-flex justify-content-end">
          <button class="btn btn-success me-2" type="submit">
            <i class="fas fa-save me-1"></i> {{ id ? "Mettre à jour" : "Enregistrer" }}
          </button>
          <button class="btn btn-secondary" routerLink="/admin/utilisateur" type="button">
            <i class="fas fa-times me-1"></i> Annuler
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<style>
.card {
  background: rgba(255,255,255,0.95);
  border-radius: 15px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.1);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.card-header.bg-gradient {
  background: linear-gradient(45deg, #8B4513, #D2691E);
}

.form-control, .form-select {
  border-radius: 10px;
  border: 1px solid #D2691E;
  padding: 0.5rem 1rem;
  background: rgba(255,255,255,0.9);
  transition: all 0.3s;
}

.form-control:focus, .form-select:focus {
  border-color: #8B4513;
  box-shadow: 0 0 10px rgba(139,69,19,0.3);
}

.btn-success {
  background: linear-gradient(45deg, #FFD700, #FFA500);
  color: white;
  border-radius: 12px;
  font-weight: 600;
}

.btn-success:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255,215,0,0.3);
}

.btn-secondary {
  border-radius: 12px;
  font-weight: 600;
  background: #ccc;
  color: #333;
}
</style>

<style>
/* Boutons style landing */
.btn-success, .btn-primary, .btn-danger {
  border: none;
  border-radius: 8px; /* arrondi léger */
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  padding: 0.5rem 1rem;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.btn-success {
  background: linear-gradient(45deg, #FFD700, #FFA500);
  color: white;
}
.btn-success:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255,215,0,0.3);
}

.btn-primary {
  background: linear-gradient(45deg, #8B4513, #D2691E);
  color: white;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139,69,19,0.3);
}

.btn-danger {
  background: linear-gradient(45deg, #D2691E, #8B4513);
  color: white;
}
.btn-danger:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139,69,19,0.3);
}

/* Table et card */
.table {
  background: rgba(255,255,255,0.95);
  border-radius: 10px;
  overflow: hidden;
}

img.img-thumbnail {
  border-radius: 8px;
  object-fit: cover;
}

.badge {
  font-weight: 600;
}

/* Header du tableau */
.table-primary th {
  background: linear-gradient(45deg, #8B4513, #D2691E);
  color: white;
}

/* Table responsive et card */
.table-responsive, .card {
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  border-radius: 10px;
}
</style>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold"><i class="fas fa-users me-2"></i> Gestion des utilisateurs</h3>
    <button class="btn btn-success" routerLink="/admin/addUser">
      <i class="fas fa-user-plus me-1"></i> Ajouter
    </button>
  </div>

  <div class="card shadow-sm border-0 rounded">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-primary">
          <tr>
            <th>Id</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Rôle</th>
            <th>Actif</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td class="fw-bold">{{ user.id }}</td>
            <td>{{ user.nom }}</td>
            <td>{{ user.prenom }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.telephone }}</td>
            <td>
              <span class="badge bg-info text-dark" *ngIf="user.role === 'CLIENT'">Client</span>
              <span class="badge bg-warning text-dark" *ngIf="user.role === 'EMPLOYE'">Employé</span>
              <span class="badge bg-danger" *ngIf="user.role === 'ADMIN'">Admin</span>
            </td>
            <td>
              <span class="badge bg-success" *ngIf="user.actif">Oui</span>
              <span class="badge bg-secondary" *ngIf="!user.actif">Non</span>
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-primary me-2" [routerLink]="['/admin/updateUser', user.id]">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-sm btn-danger" (click)="deleteUser(user.id!)">
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

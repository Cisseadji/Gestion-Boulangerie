<style>
/* Boutons style landing */
.btn-success, .btn-primary, .btn-danger {
  border: none;
  border-radius: 8px; /* léger arrondi */
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  padding: 0.6rem 1.2rem;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.btn-success {
  background: linear-gradient(45deg, #FFD700, #FFA500);
  color: white;
}
.btn-success:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255,215,0,0.3);
}

.btn-primary {
  background: linear-gradient(45deg, #8B4513, #D2691E);
  color: white;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139,69,19,0.3);
}

.btn-danger {
  background: linear-gradient(45deg, #D2691E, #8B4513);
  color: white;
}
.btn-danger:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139,69,19,0.3);
}

/* Table et card */
.table {
  background: rgba(255,255,255,0.95);
  border-radius: 10px;
  overflow: hidden;
}

.table th, .table td {
  vertical-align: middle !important;
}

img.img-thumbnail {
  border-radius: 8px;
  object-fit: cover;
}

.badge {
  font-weight: 600;
}

/* Header du tableau */
.table th {
  background: linear-gradient(45deg, #8B4513, #D2691E);
  color: white;
}

/* Table responsive et card */
.table-responsive {
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 1rem;
}
</style>

<div class="container mt-4">
  <div class="d-flex justify-content-between mb-3">
    <h3 class="fw-bold">Gestion des catégories</h3>
    <button class="btn btn-success" routerLink="/admin/addCategorie">
      <i class="fas fa-plus me-1"></i> Ajouter
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>Id</th>
          <th>Nom</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let categorie of categories">
          <td>{{ categorie.id }}</td>
          <td>{{ categorie.nom }}</td>
          <td class="text-center">
            <button class="btn btn-primary me-2" [routerLink]="['/admin/updateCategorie', categorie.id]">
              Modifier
            </button>
            <button class="btn btn-danger" (click)="deleteCategorie(categorie.id!)">
              Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="container mt-4">
  <div class="card shadow-lg border-0 rounded p-4">
    <div class="card-header bg-gradient text-white rounded-top">
      <h4 class="mb-0">
        <i class="fas fa-box me-2"></i> 
        {{ id ? "Modifier un produit" : "Ajouter un produit" }}
      </h4>
    </div>

    <div class="card-body">
      <form [formGroup]="produitForm" (ngSubmit)="onSubmit()">

        <!-- Nom -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="nom" placeholder="Entrez le nom du produit" />
          <div *ngIf="submitted && f['nom'].errors" class="form-text text-danger">
            <span *ngIf="f['nom'].errors['required']">Nom obligatoire</span>
            <span *ngIf="f['nom'].errors['minlength']">Min 2 caractères</span>
          </div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
          <textarea class="form-control" formControlName="description" rows="3" placeholder="Décrivez le produit..."></textarea>
          <div *ngIf="submitted && f['description'].errors" class="form-text text-danger">
            Description obligatoire
          </div>
        </div>

        <!-- Prix & Stock en ligne -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Prix (€) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" formControlName="prix" placeholder="Ex: 19.99" />
            <div *ngIf="submitted && f['prix'].errors" class="form-text text-danger">
              <span *ngIf="f['prix'].errors['required']">Prix obligatoire</span>
              <span *ngIf="f['prix'].errors['min']">Prix > 0</span>
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Stock <span class="text-danger">*</span></label>
            <input type="number" class="form-control" formControlName="stock" placeholder="Ex: 50" />
            <div *ngIf="submitted && f['stock'].errors" class="form-text text-danger">
              Stock obligatoire
            </div>
          </div>
        </div>

        <!-- Image Upload -->
        <div class="mb-3" *ngIf="!id">
          <label class="form-label fw-semibold">Image <span class="text-danger">*</span></label>
          <input type="file" class="form-control" (change)="onFileSelected($event)" />
          <div *ngIf="submitted && !selectedFile" class="form-text text-danger">
            Image obligatoire
          </div>
        </div>

        <div class="mb-3" *ngIf="id">
          <label class="form-label fw-semibold">Image (laisser vide si inchangée)</label>
          <input type="file" class="form-control" (change)="onFileSelected($event)" />
        </div>

        <!-- Allergènes -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Allergènes</label>
          <input type="text" class="form-control" formControlName="allergenes" placeholder="Ex: Gluten, Lactose" />
        </div>

        <!-- Catégorie -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Catégorie <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="id_categorie">
            <option value="">-- Sélectionner une catégorie --</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.nom }}</option>
          </select>
          <div *ngIf="submitted && f['id_categorie'].errors" class="form-text text-danger">
            Catégorie obligatoire
          </div>
        </div>

        <!-- Boutons -->
        <div class="d-flex justify-content-end">
          <button class="btn btn-success me-2" type="submit">
            <i class="fas fa-save me-1"></i> {{ id ? "Mettre à jour" : "Enregistrer" }}
          </button>
          <button class="btn btn-secondary" routerLink="/admin/produits" type="button">
            <i class="fas fa-times me-1"></i> Annuler
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #FFF8DC, #F5DEB3, #FFD700, #D2691E);
  background-size: 300% 300%;
  animation: bakeryGradient 20s ease infinite;
  min-height: 100vh;
  padding-top: 80px;
  color: #333;
}

@keyframes bakeryGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card {
  background: rgba(255,255,255,0.95);
  border-radius: 15px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.1);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.card-header.bg-gradient {
  background: linear-gradient(45deg, #8B4513, #D2691E);
}

.form-control, .form-select {
  border-radius: 10px;
  border: 1px solid #D2691E;
  padding: 0.5rem 1rem;
  background: rgba(255,255,255,0.9);
  transition: all 0.3s;
}

.form-control:focus, .form-select:focus {
  border-color: #8B4513;
  box-shadow: 0 0 10px rgba(139,69,19,0.3);
}

.btn-success {
  background: linear-gradient(45deg, #FFD700, #FFA500);
  color: white;
  border-radius: 12px;
  font-weight: 600;
}

.btn-success:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255,215,0,0.3);
}

.btn-secondary {
  border-radius: 12px;
  font-weight: 600;
  background: #ccc;
  color: #333;
}

</style>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - BoulangePro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FFF8DC, #F5DEB3);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* Navbar réutilisée */
    .header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    .logo { font-size:1.5rem; font-weight:bold; color:#8B4513; }
    .logo::before { content:"🥖"; margin-right:0.5rem; }

    /* Login Card */
    .login-card {
      margin-top: 100px;
      background: rgba(255,255,255,0.9);
      border-radius:20px;
      padding:2.5rem;
      width:400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      text-align:center;
      border: 2px solid #F5DEB3;
      animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }

    .login-card h2 {
      color:#8B4513;
      margin-bottom:0.5rem;
    }
    .login-card p {
      color:#666;
      margin-bottom:2rem;
    }

    .form-group { margin-bottom:1.5rem; text-align:left; position:relative; }
    .form-group label { font-weight:600; font-size:0.9rem; display:block; margin-bottom:0.3rem; }
    .form-group i { position:absolute; left:12px; top:40px; color:#D2691E; }

    .form-control {
      width:100%; padding:0.8rem 0.8rem 0.8rem 2.5rem;
      border-radius:10px;
      border:1px solid #ccc;
      background:white;
      color:#333;
      font-size:1rem;
      outline:none;
      transition:all 0.3s;
    }
    .form-control:focus { border-color:#8B4513; box-shadow:0 0 10px rgba(139,69,19,0.3); }

    .btn {
      display:block; width:100%; padding:0.9rem;
      border-radius:12px; border:none;
      font-size:1rem; font-weight:600; cursor:pointer;
      transition:all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(45deg, #8B4513, #D2691E);
      color:white;
    }
    .btn-primary:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(139,69,19,0.4); }

    .btn-outline {
      background:transparent;
      border:2px solid #8B4513;
      color:#8B4513;
      margin-top:1rem;
    }
    .btn-outline:hover { background:#8B4513; color:white; }

    .footer-text { margin-top:1.5rem; font-size:0.9rem; color:#666; }
  </style>
</head>
<body>
  

  <div class="login-card">
    <h2>Connexion</h2>
    <p>Entrez vos identifiants pour continuer</p>
    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>
        <i class="fa fa-envelope"></i>
        <input formControlName="email" type="email" class="form-control" placeholder="exemple@mail.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <i class="fa fa-lock"></i>
        <input formControlName="password" type="password" class="form-control" placeholder="********">
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        <i class="fa fa-sign-in-alt me-2"></i> Se Connecter
      </button>
    </form>
    <div class="footer-text">
      <p>Vous n'avez pas de compte ?</p>
      <button type="button" class="btn btn-outline" (click)="goToRegister()">
        <i class="fa fa-user-plus me-2"></i> S'inscrire
      </button>
    </div>
  </div>
</body>
</html>

<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">
    <div class="text-center mb-3">
      <h2 class="fw-bold text-primary">Connexion</h2>
      <p class="text-muted">Entrez vos identifiants pour continuer</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="login()">
      <!-- Email -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Adresse Email</label>
        <input formControlName="email" type="email" placeholder="exemple@mail.com" class="form-control"
          [class.is-invalid]="form.controls['email'].invalid && form.controls['email'].touched">
        <div class="invalid-feedback">Veuillez entrer un email valide</div>
      </div>

      <!-- Mot de passe -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Mot de passe</label>
        <input formControlName="password" type="password" placeholder="********" class="form-control"
          [class.is-invalid]="form.controls['password'].invalid && form.controls['password'].touched">
        <div class="invalid-feedback">Le mot de passe est requis</div>
      </div>

      <!-- Bouton connexion -->
      <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="form.invalid">
        Se Connecter
      </button>
    </form>

    <div class="text-center">
      <p class="text-muted mb-1">Vous n'avez pas de compte ?</p>
      <button class="btn btn-outline-primary w-100" (click)="goToRegister()">
        S'inscrire
      </button>
    </div>
  </div>
</div>

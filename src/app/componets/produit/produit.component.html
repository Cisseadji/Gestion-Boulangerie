<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Produits - BoulangePro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <style>
/* Boutons style landing */
.btn-success, .btn-primary, .btn-danger {
  border: none;
  border-radius: 8px; /* léger arrondi pour plus de cohérence */
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  padding: 0.6rem 1.2rem;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

/* Dégradés landing */
.btn-success {
  background: linear-gradient(45deg, #FFD700, #FFA500);
  color: white;
}
.btn-success:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255,215,0,0.3);
}

.btn-primary {
  background: linear-gradient(45deg, #8B4513, #D2691E);
  color: white;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139,69,19,0.3);
}

.btn-danger {
  background: linear-gradient(45deg, #D2691E, #8B4513);
  color: white;
}
.btn-danger:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139,69,19,0.3);
}

/* Table et card */
.table {
  background: rgba(255,255,255,0.95);
  border-radius: 10px;
  overflow: hidden;
}

img.img-thumbnail {
  border-radius: 8px;
  object-fit: cover;
}

.badge {
  font-weight: 600;
}

.table-dark th {
  background: linear-gradient(45deg, #8B4513, #D2691E);
  color: white;
}

.table-responsive {
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  border-radius: 10px;
}
</style>


</head>
<body>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Gestion des Produits</h3>
      <button class="btn btn-success" routerLink="/admin/addProduit">
        <i class="fas fa-plus me-2"></i> Ajouter un produit
      </button>
    </div>

    <div class="table-responsive shadow-sm rounded">
      <table class="table table-hover table-bordered align-middle">
        <thead class="table-dark text-white">
          <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Nom</th>
            <th>Description</th>
            <th>Prix</th>
            <th>Stock</th>
            <th>Allergènes</th>
            <th>Catégorie</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let produit of produits">
            <td class="fw-bold">#{{ produit.id }}</td>
            <td>
              <img *ngIf="produit.image_url"
                   [src]="'http://localhost:8000/storage/' + produit.image_url"
                   alt="Produit"
                   class="img-thumbnail"
                   width="70" height="70">
            </td>
            <td class="fw-semibold">{{ produit.nom }}</td>
            <td>{{ produit.description }}</td>
            <td class="text-success fw-bold">{{ produit.prix }} €</td>
            <td>
              <span class="badge"
                    [ngClass]="{
                      'bg-success': produit.stock > 10,
                      'bg-warning text-dark': produit.stock <= 10 && produit.stock > 0,
                      'bg-danger': produit.stock === 0
                    }">
                {{ produit.stock }}
              </span>
            </td>
            <td>{{ produit.allergenes || '-' }}</td>
            <td>{{ produit.id_categorie }}</td>
            <td class="text-center">
              <button class="btn btn-primary me-2" [routerLink]="['/admin/updateProduit', produit.id]">
                <i class="fas fa-edit"></i> Modifier
              </button>
              <button class="btn btn-danger" (click)="deleteProduit(produit.id!)">
                <i class="fas fa-trash-alt"></i> Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>

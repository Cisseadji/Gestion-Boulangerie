<div class="container mt-4">

  <h3 class="mb-3">Commandes prêtes pour livraison</h3>

  <div *ngIf="loading" class="alert alert-info">Chargement...</div>
  <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>
  <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

  <ul class="list-group mb-4" *ngIf="commandesPretes.length > 0">
    <li class="list-group-item d-flex justify-content-between align-items-center"
        *ngFor="let cmd of commandesPretes">
      <div>
        <strong>Commande #{{ cmd.id }}</strong> - Total: {{ cmd.total | currency:'EUR' }}
      </div>
      <button (click)="creerLivraison(cmd)" class="btn btn-sm btn-primary">
        Créer Livraison
      </button>
    </li>
  </ul>

  <p *ngIf="!loading && commandesPretes.length === 0" class="text-muted">
    Aucune commande prête pour livraison.
  </p>

<!-- livraisons.component.html -->
<div class="container mt-4">
  <h2>Livraisons</h2>

  <table class="table table-bordered" *ngIf="commandes.length; else vide">
    <thead>
      <tr>
        <th>ID</th>
        <th *ngIf="role !== 'CLIENT'">Client</th>
        <th>Produits</th>
        <th>Quantité</th>
        <th>Statut</th>
        <th>Date</th>
        <th *ngIf="role === 'EMPLOYE' || role === 'ADMIN' || role === 'GERANT'">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let commande of commandes">
        <td>{{ commande.id }}</td>
        <td *ngIf="role !== 'CLIENT'">{{ commande.id_client }}</td>
        <td>
          <ul>
            <li *ngFor="let p of commande.produits">{{ p.nom }}</li>
          </ul>
        </td>
        <td>
          <ul>
            <li *ngFor="let p of commande.produits">{{ p.pivot.quantite }}</li>
          </ul>
        </td>

        <td>
          <span *ngIf="role === 'CLIENT'">{{ commande.statut }}</span>

          <select *ngIf="role === 'EMPLOYE' || role === 'ADMIN' || role === 'GERANT'"
                  [(ngModel)]="commande.statut"
                  (change)="updateStatut(commande.id!, commande.statut)">
            <option value="EN_PREPARATION">En préparation</option>
            <option value="PRETE">Prête</option>
            <option value="EN_LIVRAISON">En livraison</option>
            <option value="LIVREE">Livrée</option>
          </select>
        </td>

        <td>{{ commande.date_commande | date:'short' }}</td>

        <td *ngIf="role === 'EMPLOYE' || role === 'ADMIN' || role === 'GERANT'">
          <button class="btn btn-primary btn-sm" 
                  *ngIf="commande.statut === 'PRETE'" 
                  (click)="updateStatut(commande.id!, 'EN_LIVRAISON')">
            Mettre en livraison
          </button>
          <button class="btn btn-success btn-sm" 
                  *ngIf="commande.statut === 'EN_LIVRAISON'" 
                  (click)="updateStatut(commande.id!, 'LIVREE')">
            Livrée
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #vide>
    <p class="text-muted">Aucune commande à afficher.</p>
  </ng-template>
</div>

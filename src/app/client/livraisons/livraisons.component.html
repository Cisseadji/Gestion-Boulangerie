<style>
/* Boutons style landing */
.btn-success, .btn-primary, .btn-danger {
  border: none;
  border-radius: 8px; /* léger arrondi pour plus de cohérence */
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  padding: 0.6rem 1.2rem;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

/* Dégradés landing */
.btn-success {
  background: linear-gradient(45deg, #FFD700, #FFA500);
  color: white;
}
.btn-success:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255,215,0,0.3);
}

.btn-primary {
  background: linear-gradient(45deg, #8B4513, #D2691E);
  color: white;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139,69,19,0.3);
}

.btn-danger {
  background: linear-gradient(45deg, #D2691E, #8B4513);
  color: white;
}
.btn-danger:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(139,69,19,0.3);
}

/* Table et card */
.table {
  background: rgba(255,255,255,0.95);
  border-radius: 10px;
  overflow: hidden;
}

img.img-thumbnail {
  border-radius: 8px;
  object-fit: cover;
}

.badge {
  font-weight: 600;
}

.table-dark th {
  background: linear-gradient(45deg, #8B4513, #D2691E);
  color: white;
}

.table-responsive {
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  border-radius: 10px;
}
</style>


<div class="container mt-4">
  <div *ngIf="loading" class="alert alert-info">Chargement...</div>
  <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>
  <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>
   <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Liste des livraisons</h3>
   <button class="btn btn-success" routerLink="/employe/addLivraison">
      <i class="fas fa-plus me-2"></i> Ajouter un livraison
    </button>
    </div>

  <table class="table table-bordered table-striped" *ngIf="livraisons.length > 0">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Commande</th>
      <th>Adresse</th>
      <th>Date prévue</th>
      <th>Statut</th>
      <th>Actions</th> <!-- Nouvelle colonne -->
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let livraison of livraisons">
      <td>{{ livraison.id }}</td>
      <td>{{ livraison.id_commande }}</td>
      <td>{{ livraison.adresse }}</td>
      <td>{{ livraison.date_prevue | date:'short' }}</td>
      <td>
        <select [(ngModel)]="livraison.statut"
                (change)="updateStatut(livraison, livraison.statut)"
                class="form-select form-select-sm">
          <option value="EN_COURS">En cours</option>
          <option value="LIVREE">Livrée</option>
          <option value="ANNULEE">Annulée</option>
        </select>
      </td>
      <td>


        <!-- Bouton Supprimer -->
        <button class="btn btn-danger btn-sm"
                (click)="deleteLivraison(livraison.id)">
          <i class="fas fa-trash"></i> Supprimer
        </button>
      </td>
    </tr>
  </tbody>
</table>


  <p *ngIf="!loading && livraisons.length === 0" class="text-muted">
    Aucune livraison trouvée.
  </p>

</div>

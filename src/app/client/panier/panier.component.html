<div class="panier-page container mt-3">

  <h3>Mon Panier</h3>

  <div class="row g-3" *ngIf="cart.items().length; else vide">
    <div class="col-md-4" *ngFor="let item of cart.items()">
      <div class="card shadow-sm h-100 border-0">
        <img
          [src]="'http://localhost:8000/storage/' + item.produit.image_url"
          class="card-img-top"
          [alt]="item.produit.nom"
          style="height:200px; object-fit:cover;"
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ item.produit.nom }}</h5>
          <p class="card-text mb-1">Quantité : {{ item.quantity }}</p>
          <p class="card-text mb-1">Prix unitaire : {{ item.produit.prix | currency:'EUR' }}</p>
          <p class="card-text fw-bold">Total : {{ item.produit.prix * item.quantity | currency:'EUR' }}</p>

          <button class="btn btn-danger mt-auto" (click)="cart.remove(item.produit.id)">
            Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #vide>
    <p class="text-muted mt-3">Votre panier est vide.</p>
  </ng-template>

  <div class="mt-3">
    <label class="form-label">Adresse de livraison</label>
    <input type="text" class="form-control" [(ngModel)]="adresse" placeholder="Entrez votre adresse">
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3" *ngIf="cart.items().length">
    <h5>Total : {{ cart.total() | currency:'EUR' }}</h5>
    <button class="btn btn-success" (click)="commander()">Commander</button>
  </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold">Notre Catalogue</h3>
  <select class="form-select" style="max-width: 220px" [(ngModel)]="category">
    <option value="all">Toutes les catégories</option>
    <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
  </select>
</div>

<div class="row g-4">
  <div
    class="col-md-4"
    *ngFor="let p of produits"
    [hidden]="category !== 'all' && p.id_categorie.nom !== category"
  >
    <div class="card shadow-sm h-100 border-0">
      <div class="position-relative">
        <img
          [src]="'http://localhost:8000/storage/' + p.image_url"
          class="card-img-top"
          [alt]="p.nom"
          style="height:200px; object-fit:cover;"
        />

        <!-- Badge catégorie -->
        <span class="badge bg-light text-dark position-absolute top-0 start-0 m-2">
          {{ p.id_categorie.nom }}
        </span>
      </div>

      <div class="card-body d-flex flex-column">
        <h5 class="fw-bold">{{ p.nom }}</h5>
        <p class="text-muted small mb-2">{{ p.description }}</p>

        <!-- Prix -->
        <div class="mb-2">
          <span class="fw-bold text-danger fs-5">
            {{ p.prix | currency:'EUR' }}
          </span>
        </div>

        <!-- Stock -->
        <div class="mb-2">
          <span class="badge bg-success" *ngIf="p.stock > 10">En stock</span>
          <span class="badge bg-warning text-dark" *ngIf="p.stock <= 10 && p.stock > 0">Stock limité</span>
          <span class="badge bg-secondary" *ngIf="p.stock === 0">Rupture</span>
        </div>

        <!-- Allergènes -->
        <div class="mb-2" *ngIf="p.allergenes && p.allergenes.length">
          <small class="text-muted">Allergènes :</small>
          <span
            class="badge bg-light text-dark me-1"
            *ngFor="let a of p.allergenes"
          >
            {{ a }}
          </span>
        </div>

        <button class="btn btn-warning mt-auto" (click)="ajouterpanier(p)">
          Ajouter au panier
        </button>
      </div>
    </div>
  </div>
</div>
